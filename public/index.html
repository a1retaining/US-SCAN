<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingMint Pro</title>

<style>
body{
    margin:0;
    background:#050816;
    color:white;
    font-family:Arial;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100vh;
    background:#081120;
    border-right:1px solid #1cff73;
    padding:20px;
}

.logo{
    color:#1cff73;
    font-size:28px;
    font-weight:bold;
    margin-bottom:40px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu button{
    background:#101b2d;
    border:1px solid #1cff73;
    color:white;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.main{
    margin-left:260px;
    padding:20px;
}

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:#0d1728;
    border:1px solid #1cff73;
    border-radius:14px;
    padding:20px;
}

.big{
    font-size:30px;
    color:#1cff73;
}

.table{
    margin-top:20px;
    background:#0d1728;
    border:1px solid #1cff73;
    border-radius:14px;
    overflow:hidden;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    padding:15px;
    border-bottom:1px solid #1d2d46;
}

.header{
    background:#101f36;
    font-weight:bold;
}

.trade-popup{
    position:fixed;
    bottom:20px;
    right:20px;
    width:320px;
    background:#0d1728;
    border:2px solid #8b5cf6;
    border-radius:16px;
    padding:20px;
    box-shadow:0 0 20px #8b5cf6;
}

.green{
    color:#1cff73;
}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
TRADING<br>MINT PRO
</div>

<div class="menu">
<button>Dashboard</button>
<button>Live Scanner</button>
<button>Positions</button>
<button>Performance</button>
<button>Backtests</button>
<button>Alerts</button>
<button>Settings</button>
</div>

</div>

<div class="main">

<div class="top">

<div class="card">
<div>Market Regime</div>
<div class="big">BULLISH</div>
</div>

<div class="card">
<div>SPY Trend</div>
<div class="big">STRONG</div>
</div>

<div class="card">
<div>Market Breadth</div>
<div class="big">78%</div>
</div>

<div class="card">
<div>AI Confidence</div>
<div class="big">82</div>
</div>

</div>

<div class="table">

<div class="row header">
<div>Ticker</div>
<div>Setup</div>
<div>Confidence</div>
<div>Action</div>
</div>

<div class="row">
<div>NVDA</div>
<div>Breakout</div>
<div class="green">89</div>
<div class="green">LONG</div>
</div>

<div class="row">
<div>AMD</div>
<div>Pullback</div>
<div class="green">82</div>
<div class="green">LONG</div>
</div>

<div class="row">
<div>META</div>
<div>Momentum</div>
<div>79</div>
<div>WATCH</div>
</div>

</div>

</div>

<div class="trade-popup">
<h2 class="green">TRADE TAKEN</h2>

<p><strong>NVDA</strong></p>

<p>Entry: $946</p>
<p>Stop: $932</p>
<p>Target: $965</p>

<p class="green">Confidence 89%</p>
</div>

</body>
</html>
